name: PHP syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring, zip
      - name: Lint tracked PHP files
        run: git ls-files '*.php' -z | xargs -0 -n1 php -l
